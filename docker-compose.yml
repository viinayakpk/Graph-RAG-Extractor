services:
  pipeline:
    build: .
    env_file: .env                    # reads DEEPSEEK_API_KEY etc.
    volumes:
      - ./pdfs:/data/input:ro         # put your tender PDFs here
      - ./outputs:/data/output        # results appear here (one folder per tender)
    # Process every PDF found in ./pdfs as its own tender.
    command: ["--dir", "/data/input", "--output", "/data/output"]
