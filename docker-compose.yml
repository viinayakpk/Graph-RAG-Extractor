services:
  pipeline:
    build: .
    env_file: .env
    volumes:
      - ./pdfs:/data/input:ro
      - ./outputs:/data/output
    # Process all three tenders in a single run.
    # PDF filenames must match exactly what you placed in ./pdfs/
    command:
      - "--pdf"
      - "/data/input/Tender_For_Christmas_Lights_Installation_2026.pdf"
      - "--pdf"
      - "/data/input/Salzburg Laboratory Tender.pdf"
      - "--pdf"
      - "/data/input/LV_Fahrradgaragen.pdf"
      - "--output"
      - "/data/output"
